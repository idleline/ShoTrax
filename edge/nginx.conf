user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    map $ssl_preread_server_name $tls_backend {
        cb.shotrax.live 127.0.0.1:18443;
        st.shotrax.live 127.0.0.1:28443;
        default         127.0.0.1:9;
    }

    log_format sni '$remote_addr [$time_local] '
                   '$ssl_preread_server_name $protocol $status '
                   '$bytes_sent $bytes_received $session_time';
    access_log /dev/stdout sni;

    server {
        listen 443;
        listen [::]:443;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_pass $tls_backend;
        ssl_preread on;
    }
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /edge-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 421;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name cb.shotrax.live;

        location / {
            proxy_pass http://127.0.0.1:18080;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name st.shotrax.live;

        location / {
            proxy_pass http://127.0.0.1:28080;
        }
    }
}
