name: shotrax

services:
  app:
    build:
      context: .
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-2026-08-19-v2}
    image: shotrax:${RELEASE_VERSION:-2026-08-19-v2}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: sqlite:////data/baseball_hits.db
    volumes:
      - app-data:/data
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: nginx:1.30.4-alpine3.24-slim
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:28080:80"
      - "127.0.0.1:28443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./state/certbot/conf:/etc/letsencrypt:ro
      - ./state/certbot/www:/var/www/certbot:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  edge:
    build:
      context: edge
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-2026-08-19-v2}
    image: shotrax-edge:${RELEASE_VERSION:-2026-08-19-v2}
    restart: unless-stopped
    network_mode: host
    depends_on:
      nginx:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/edge-health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  certbot:
    image: certbot/certbot:v5.7.0
    profiles:
      - maintenance
    volumes:
      - ./state/certbot/conf:/etc/letsencrypt
      - ./state/certbot/www:/var/www/certbot

volumes:
  app-data:
